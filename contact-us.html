<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Bittu Sha</title>

  <meta name="description" content="Contact Bittu Sha for SEO services, web development, digital marketing, or questions about online earning in Khasi language." />
  <meta name="author" content="Bittu Sha" />

  <link rel="canonical" href="https://www.bittusha.in/contact-us.html" />
  <link rel="icon" href="logo.png" alt="favicon">
  <link name="robots" content="index, follow" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      margin: 0;
      line-height: 1.8;
    }

    header {
      background: rgba(10,10,10,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    nav a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      margin-left: 25px;
      font-weight: 500;
    }

    nav a:hover {
      color: #ffffff;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 100px 20px;
    }

    .contact-box {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #ffffff, #a0a0a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: rgba(255,255,255,0.75);
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .contact-method {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      font-size: 1.1rem;
      color: rgba(255,255,255,0.85);
    }

    .contact-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .contact-method a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
    }

    .contact-method a:hover {
      color: #ffffff;
    }

    .contact-form {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      padding: 15px 40px;
      color: white;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    footer {
      background: #0a0a0a;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 40px 20px;
      text-align: center;
      color: rgba(255,255,255,0.5);
    }

   
    @media (max-width: 768px) {
      .contact-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <div class="logo">Bittu Sha</div>
    <div>
      <a href="bittusha.in">Home</a>
      <a href="/about-us.html">About</a>
      <a href="/blog.html">Blog</a>
    </div>
  </nav>
</header>

<div class="container">
  <div class="contact-box">

    <!-- LEFT SIDE INFO -->
    <div>
      <h1>Contact Us</h1>

      <p>
        Have questions, suggestions, or business enquiries?  
        Feel free to contact me anytime. I’ll be happy to help you 😊
      </p>

      <div class="contact-method">
        <div class="contact-icon"><i class="fas fa-envelope"></i></div>
        <div>
          <strong>Email</strong><br>
          <a href="mailto:shabittu093@gmail.com">shabittu093@gmail.com</a>
        </div>
      </div>

      <div class="contact-method">
        <div class="contact-icon"><i class="fas fa-phone"></i></div>
        <div>
          <strong>Phone</strong><br>
          <a href="tel:+917619660526">+91 76196 60526</a>
        </div>
      </div>

      <div class="contact-method">
        <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
        <div>
          <strong>Location</strong><br>
          Shillong, Meghalaya, India
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE FORM -->
    <div class="contact-form">
      <form onsubmit="event.preventDefault(); alert('Thank you for contacting me! I will reply soon.');">

        <div class="form-group">
          <label>Your Name</label>
          <input type="text" required placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label>Subject</label>
          <input type="text" required placeholder="Subject">
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea required placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 Bittu Sha. All rights reserved.</p>
</footer>

</body>
</html>
